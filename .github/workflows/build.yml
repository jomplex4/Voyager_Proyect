name: Build VOYAGER

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * 1'   # cada lunes: si YouTube cambio y NewPipeExtractor saco version nueva, compila sola

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Revision semanal de NewPipeExtractor (solo los lunes)
        id: np
        if: github.event_name == 'schedule'
        run: |
          latest=$(curl -s -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/TeamNewPipe/NewPipeExtractor/releases/latest | grep -m1 '"tag_name"' | cut -d'"' -f4)
          current=$(grep -m1 '^newpipe = ' gradle/libs.versions.toml | cut -d'"' -f2)
          echo "actual=$current ultima=$latest"
          if [ -n "$latest" ] && [ "$latest" != "$current" ]; then
            sed -i "s/^newpipe = \"[^\"]*\"/newpipe = \"$latest\"/" gradle/libs.versions.toml
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "tag=$latest" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v4
        if: github.event_name != 'schedule' || steps.np.outputs.changed == 'true'
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        if: github.event_name != 'schedule' || steps.np.outputs.changed == 'true'
        with:
          gradle-version: '8.9'

      - name: Build release APK (con reintentos por si JitPack tarda)
        if: github.event_name != 'schedule' || steps.np.outputs.changed == 'true'
        run: |
          ok=0
          for i in 1 2 3; do
            if gradle assembleRelease --no-daemon --stacktrace; then ok=1; break; fi
            echo "Intento $i fallo, esperando 30 s..."
            sleep 30
          done
          [ "$ok" = "1" ]

      - name: Nombrar el APK
        if: github.event_name != 'schedule' || steps.np.outputs.changed == 'true'
        run: |
          mkdir -p dist
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then NAME="VOYAGER-${GITHUB_REF_NAME}"; else NAME="VOYAGER-run${{ github.run_number }}"; fi
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          cp "$APK" "dist/${NAME}.apk"
          ls -la dist

      - uses: actions/upload-artifact@v4
        if: github.event_name != 'schedule' || steps.np.outputs.changed == 'true'
        with:
          name: VOYAGER-apk
          path: dist/*.apk

      - name: Crear GitHub Release (solo con tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        run: gh release create "${GITHUB_REF_NAME}" dist/*.apk --title "VOYAGER ${GITHUB_REF_NAME}" --generate-notes

      - name: Release automatico con el extractor nuevo
        if: github.event_name == 'schedule' && steps.np.outputs.changed == 'true'
        run: |
          git config user.name "voyager-bot"
          git config user.email "voyager-bot@users.noreply.github.com"
          git add gradle/libs.versions.toml
          git commit -m "NewPipeExtractor ${{ steps.np.outputs.tag }} (automatico)"
          git push
          gh release create "auto-${{ github.run_number }}" dist/*.apk --title "VOYAGER auto (YouTube ${{ steps.np.outputs.tag }})" --notes "Compilada sola porque NewPipeExtractor saco la version ${{ steps.np.outputs.tag }}. Instala este APK encima del anterior."
