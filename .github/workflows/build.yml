name: Build VOYAGER

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build release APK (con reintentos por si JitPack tarda)
        run: |
          ok=0
          for i in 1 2 3; do
            if gradle assembleRelease --no-daemon --stacktrace; then ok=1; break; fi
            echo "Intento $i fallo, esperando 30 s..."
            sleep 30
          done
          [ "$ok" = "1" ]

      - name: Nombrar el APK
        run: |
          mkdir -p dist
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then NAME="VOYAGER-${GITHUB_REF_NAME}"; else NAME="VOYAGER-run${{ github.run_number }}"; fi
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          cp "$APK" "dist/${NAME}.apk"
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: VOYAGER-apk
          path: dist/*.apk

      - name: Crear GitHub Release (solo con tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        run: gh release create "${GITHUB_REF_NAME}" dist/*.apk --title "VOYAGER ${GITHUB_REF_NAME}" --generate-notes
  release:
    needs: apk
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: angelina-debug-apk
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/*.apk --title "ANGELINA ${GITHUB_REF_NAME}" --generate-notes