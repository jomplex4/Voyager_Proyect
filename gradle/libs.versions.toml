# Todas las versiones del proyecto viven en este archivo.
# Si GitHub Actions dice "could not resolve ...", casi siempre es una version de aqui.
[versions]
agp = "8.7.3"                  # Android Gradle Plugin (requiere Gradle 8.9)
kotlin = "2.0.21"              # verificado en github.com/JetBrains/kotlin
composeBom = "2024.12.01"
activityCompose = "1.9.3"
lifecycle = "2.8.7"
coreKtx = "1.15.0"
media3 = "1.5.1"               # verificado en github.com/androidx/media (tag 1.5.1)
coil = "2.7.0"
okhttp = "4.12.0"
coroutines = "1.9.0"           # verificado en github.com/Kotlin/kotlinx.coroutines
newpipe = "v0.26.5"            # ULTIMA version al construir; verificada en github.com/TeamNewPipe/NewPipeExtractor
webkit = "1.12.1"             # scripts al inicio de la pagina de Facebook
desugar = "2.1.5"              # misma version que usa NewPipe

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-material3 = { module = "androidx.compose.material3:material3" }
media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
media3-ui = { module = "androidx.media3:media3-ui", version.ref = "media3" }
media3-session = { module = "androidx.media3:media3-session", version.ref = "media3" }
coil-compose = { module = "io.coil-kt:coil-compose", version.ref = "coil" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
newpipe-extractor = { module = "com.github.TeamNewPipe:NewPipeExtractor", version.ref = "newpipe" }
androidx-webkit = { module = "androidx.webkit:webkit", version.ref = "webkit" }
desugar = { module = "com.android.tools:desugar_jdk_libs_nio", version.ref = "desugar" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
